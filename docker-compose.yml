services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lawcheck
      POSTGRES_PASSWORD: lawcheck_local
      POSTGRES_DB: lawcheck
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - lawcheck_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lawcheck -d lawcheck']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  lawcheck_pgdata:
